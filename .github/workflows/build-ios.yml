name: Build Still iOS App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Homebrew Tap-Trust Umgehung aktivieren
      run: echo "HOMEBREW_NO_REQUIRE_TAP_TRUST=1" >> $GITHUB_ENV

    - name: XcodeGen installieren
      run: brew install xcodegen

    - name: Alte Caches und Projekte bereinigen
      run: |
        rm -rf ~/.xcodegen/cache
        rm -rf Still.xcodeproj
        rm -rf build/
        rm -rf DerivedData/

    - name: Xcode-Projekt (Still.xcodeproj) generieren
      run: xcodegen generate

    - name: App für iOS-Simulator bauen
      run: |
        xcodebuild build \
          -project Still.xcodeproj \
          -scheme Still \
          -destination 'generic/platform=iOS Simulator' \
          -configuration Release \
          -derivedDataPath build/DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""

    - name: .app Artefakt speichern
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: Still-iOS-Simulator-App
        path: build/DerivedData/Build/Products/Release-iphonesimulator/Still.app

    - name: Appetize ZIP erstellen
      if: success()
      run: |
        ditto -c -k --sequesterRsrc --keepParent \
          build/DerivedData/Build/Products/Release-iphonesimulator/Still.app \
          build/Still-iOS-Simulator.zip

    - name: Appetize ZIP speichern
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: Still-iOS-Simulator-ZIP
        path: build/Still-iOS-Simulator.zip