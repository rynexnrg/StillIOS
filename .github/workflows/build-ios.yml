name: Build Still iOS App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Homebrew Tap-Trust Umgehung aktivieren
      run: echo "HOMEBREW_NO_REQUIRE_TAP_TRUST=1" >> $GITHUB_ENV

    - name: XcodeGen installieren
      run: brew install xcodegen

    - name: Alte Caches und Projekte bereinigen
      run: |
        rm -rf ~/.xcodegen/cache
        rm -rf Still.xcodeproj
        rm -rf build/
        rm -rf DerivedData/

    - name: Xcode-Projekt (Still.xcodeproj) generieren
      run: xcodegen generate

    - - name: App & Widgets kompilieren (Simulator)
      run: |
        xcodebuild build \
          -project Still.xcodeproj \
          -scheme Still \
          -sdk iphonesimulator \
          -configuration Debug \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO

    - name: Build Artifacts speichern
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Still-iOS-Build
        path: build/Build/Products/Debug-iphonesimulator/