name: Build Still iOS App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Homebrew Tap-Trust Umgehung aktivieren
      run: echo "HOMEBREW_NO_REQUIRE_TAP_TRUST=1" >> $GITHUB_ENV

    - name: XcodeGen installieren
      run: brew install xcodegen

    - name: Alte Caches und Projekte bereinigen
      run: |
        rm -rf ~/.xcodegen/cache
        rm -rf Still.xcodeproj
        rm -rf build/
        rm -rf DerivedData/

    - name: Xcode-Projekt (Still.xcodeproj) generieren
      run: xcodegen generate

    - name: App für echtes iOS-Gerät archivieren (unsigniert)
      run: |
        xcodebuild archive \
          -project Still.xcodeproj \
          -scheme Still \
          -sdk iphoneos \
          -archivePath build/Still.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""

    - name: Unsignierte .ipa Datei paketieren
      run: |
        mkdir -p build/Payload
        cp -r build/Still.xcarchive/Products/Applications/*.app build/Payload/
        cd build && zip -r Still.ipa Payload

    - name: .ipa Artefakt speichern
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Still-iOS-IPA
        path: build/Still.ipa