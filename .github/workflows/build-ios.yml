name: Build Still iOS App (.ipa)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: XcodeGen installieren
      run: brew install xcodegen

    - name: Alte Caches und Projekte bereinigen
      run: |
        rm -rf Still.xcodeproj
        rm -rf build/

    - name: Xcode-Projekt generieren
      run: xcodegen generate

    - name: App für echtes iOS-Gerät kompilieren
      run: |
        xcodebuild build \
          -project Still.xcodeproj \
          -scheme Still \
          -destination 'generic/platform=iOS' \
          -configuration Release \
          -derivedDataPath build/DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY=""

    - name: .ipa Paket erstellen
      run: |
        mkdir -p build/Payload
        cp -R build/DerivedData/Build/Products/Release-iphoneos/Still.app build/Payload/
        cd build
        zip -r Still.ipa Payload
        cd ..

    - name: .ipa Artefakt hochladen
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: Still-iOS-App-IPA
        path: build/Still.ipa